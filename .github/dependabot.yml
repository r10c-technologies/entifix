version: 2
updates:
  - package-ecosystem: 'npm' # pnpm workspace; the root manifest covers packages/* and examples/*
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    ignore:
      # `pnpm nx migrate latest` owns these pins and moves them as a set Nx has
      # tested together, with codemods. Dependabot moving one alone breaks the
      # set — TypeScript 7 is the Go-native rewrite whose JS API drops what
      # @nx/js/typescript calls while it builds the project graph.
      - dependency-name: 'typescript'
      - dependency-name: 'typescript-eslint'
      - dependency-name: '@typescript-eslint/*'
      - dependency-name: '@swc/*'
      - dependency-name: '@swc-node/*'
      - dependency-name: 'vite'
      - dependency-name: 'vitest'
      - dependency-name: '@vitest/*'
      - dependency-name: 'next'
      - dependency-name: 'eslint-config-next'
      - dependency-name: '@next/*'
      - dependency-name: 'webpack*'
      - dependency-name: 'nx'
      - dependency-name: '@nx/*'
      - dependency-name: 'verdaccio'
      # An effect minor is not a drop-in here. 4.1 changed `sql.insert`'s
      # signature, moved `NodeSdk` out of @effect/opentelemetry's barrel and
      # replaced `effect/Crypto` — and its cluster engine resumes a signalled
      # wait about two seconds late, now and then: 6 of 225 signal cases over
      # Postgres against 0 of 225 on 4.0.6, measured 2026-11-02. It is held on
      # the 4.0 line for that. A move off the line is a commit with its own
      # migration and a stall count behind it. Patches still come through.
      - dependency-name: 'effect'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@effect/*'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      # OpenTelemetry moves as one set or not at all. The 2.x SDK packages peer
      # on `@opentelemetry/api` `<1.10.0`, @effect/opentelemetry peers on the
      # 2.x SDK and the 0.223 exporters, and pnpm does not fail an install on a
      # peer mismatch — so a bump into any of these would pass CI and break a
      # consumer. Lift all three rules in the commit that adopts OTel 3.
      - dependency-name: '@opentelemetry/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@opentelemetry/api'
        versions: ['>=1.10.0']
      - dependency-name: '@opentelemetry/exporter-*'
        versions: ['>=0.224.0']
    groups:
      # Every @effect/* package is released alongside, and peers on, the
      # matching effect, so the family moves as one pull request or not at all.
      effect:
        patterns: ['effect', '@effect/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      # Majors are excluded on purpose: a grouped major cannot be bisected, so
      # one broken member hides every healthy one. Ungrouped, a red check names
      # the package.
      #
      # The named groups above are excluded by pattern too. Without it the
      # first run split effect 4.0.7 across three pull requests (#151, #152,
      # #153): a type group took the @effect/* packages before the effect group
      # could, and merging any one of the three alone mismatches the family.
      dev-dependencies:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
        exclude-patterns:
          [
            'effect',
            '@effect/*',
            'react',
            'react-dom',
            '@types/react',
            '@types/react-dom',
          ]
      production-dependencies:
        dependency-type: 'production'
        update-types: ['minor', 'patch']
        exclude-patterns:
          [
            'effect',
            '@effect/*',
            'react',
            'react-dom',
            '@types/react',
            '@types/react-dom',
          ]
    # commitlint's Nx-scope preset, which CI runs over every commit in a pull
    # request, accepts only a project name as the scope, so Dependabot's
    # usual `deps` would fail every one of its pull requests.
    commit-message:
      prefix: 'chore(source)'
      prefix-development: 'chore(source)'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    # Majors are left ungrouped for the same reason as above, and because a
    # pull request touching only workflows makes no project affected: its own
    # run skips build and test, so a grouped major would merge on the strength
    # of the jobs it did not run.
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(source)'
