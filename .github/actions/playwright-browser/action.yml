name: Install the Playwright browser
description: >-
  Chromium at the version the workspace's Playwright pins, restored from the
  Actions cache when it can be and installed with its system libraries when it
  cannot. Shared by every job that drives a browser, so the apt workaround
  below is written once.
runs:
  using: composite
  steps:
    - name: Resolve the Playwright version
      id: playwright
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Restore the browser
      id: browser
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    # ⚠️ **Drop Google's Chrome apt repository before installing anything.**
    # Both install paths below shell out to `apt-get update`, which fails the
    # whole job if *any* configured repository is inconsistent — and the
    # runner image ships `dl.google.com/linux/chrome-stable` preconfigured. On
    # 2026-09-09 that index served a `Packages.gz` whose hash did not match its
    # Release file for over an hour, and every browser run in r10c failed with
    # `Hash Sum mismatch` before a single spec ran. Playwright downloads its
    # own pinned Chromium, so the repository is a dependency this job never
    # asked for. Matched by content, not filename: the image ships it in
    # deb822 form (`*.sources`) too.
    - name: Drop apt sources this job does not need
      shell: bash
      run: |
        sudo bash -euo pipefail -c '
          for file in $(grep -rl "dl\.google\.com" /etc/apt/sources.list.d 2>/dev/null || true); do
            echo "removing $file"
            rm -f "$file"
          done
          sed -i "/dl\.google\.com/d" /etc/apt/sources.list 2>/dev/null || true
        '
    - name: Install the browser
      if: steps.browser.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
    - name: Install the browser's system libraries
      if: steps.browser.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm exec playwright install-deps chromium
    # Saved from `main` only, so one entry serves every pull request.
    - if: github.ref == 'refs/heads/main' && steps.browser.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
