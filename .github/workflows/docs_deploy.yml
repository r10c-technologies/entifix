name: Docs Deploy

# entifix's documentation instance (ADR 0031 §3): the records, the package
# reference and the controls' Storybook, one origin, on Cloud Run. The hosting
# is declared outside this repository, with the infrastructure it runs beside,
# and grants this repository a Workload Identity Federation deploy identity —
# no key is stored anywhere.
#
# The image is built on every push to `main` that touches what the site shows,
# so a broken build is seen on `main` whether or not anything is deployed.
# Deploying needs three repository variables, which exist only once the
# infrastructure is applied; until then the deploy job is skipped, by design:
#   DOCS_GCP_PROJECT           the project id
#   DOCS_GCP_WIF_PROVIDER      projects/<n>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   DOCS_GCP_DEPLOY_SA         the deploy service account's email
on:
  push:
    branches: [main]
    paths:
      - docs/adr/**
      - examples/docs/**
      - packages/**
      - .github/workflows/docs_deploy.yml
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: true

env:
  REGION: us-central1
  SERVICE: entifix-docs
  REPOSITORY: docs

jobs:
  build:
    name: Build the instance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install: 'true'
      - name: Build the site and its Storybook
        run: pnpm nx build @entifix/example-docs --skip-nx-cache
      - name: Build the image
        run: docker build -t entifix/docs:${{ github.sha }} examples/docs
      - name: Answer health from the image
        run: |
          docker run -d --name docs -p 8080:8080 entifix/docs:${{ github.sha }}
          for _ in $(seq 1 20); do curl -fsS http://localhost:8080/health && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:8080/docs/
          curl -fsS -o /dev/null http://localhost:8080/ui/
          docker rm -f docs
      - name: Keep the image for the deploy job
        if: vars.DOCS_GCP_PROJECT != ''
        run: docker save entifix/docs:${{ github.sha }} | gzip > docs-image.tar.gz
      - if: vars.DOCS_GCP_PROJECT != ''
        uses: actions/upload-artifact@v7
        with:
          name: docs-image
          path: docs-image.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to Cloud Run
    needs: build
    if: vars.DOCS_GCP_PROJECT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To exchange this job's OIDC token for the deploy identity.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs-image
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.DOCS_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.DOCS_GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Push the image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ vars.DOCS_GCP_PROJECT }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          gunzip -c docs-image.tar.gz | docker load
          docker tag "entifix/docs:$GITHUB_SHA" "$IMAGE"
          docker push "$IMAGE"
      - name: Roll the service onto it
        run: >-
          gcloud run deploy "$SERVICE"
          --project "${{ vars.DOCS_GCP_PROJECT }}"
          --region "$REGION"
          --image "$REGION-docker.pkg.dev/${{ vars.DOCS_GCP_PROJECT }}/$REPOSITORY/$SERVICE:$GITHUB_SHA"
          --quiet
