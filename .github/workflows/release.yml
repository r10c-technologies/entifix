name: Release

# Publishes the version that a merged release pull request already decided.
#
# This file's name is load-bearing: the npm trusted publisher claim on all 23
# packages names `release.yml` on this repository. Renaming it revokes this
# workflow's ability to publish, silently, and the packages would have to be
# re-trusted one at a time.
on:
  pull_request:
    types: [closed]
    branches: [main]
  # Kept so a release can be finished by hand when the merge path fails —
  # a publish that half-succeeded, say. It publishes whatever version is in the
  # manifests on `main`.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Detection is on the branch name, deliberately not on the head commit's
  # message: a merge-commit merge leaves "Merge pull request #N…" as the
  # message, and the release would silently never fire. The branch name is the
  # same under squash, merge and rebase.
  verify:
    name: Prove it before publishing it
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # `github.sha` on a pull_request event is the ephemeral merge ref, which
      # is not what was merged. `main` is.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: '11.9'
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      # Deliberately no `registry-url`: it writes an `~/.npmrc` line pointing at
      # NODE_AUTH_TOKEN, and there is no token to point it at.
      - run: pnpm install --frozen-lockfile

      - name: The same gate every pull request passes
        run: |
          pnpm nx run-many -t lint
          pnpm nx run-many -t build --skipTypeCheck=false
          pnpm nx run-many -t typecheck
          pnpm nx run-many -t test --coverage

      - name: The repository's own assertions
        run: |
          pnpm nx test @entifix/tiers
          pnpm nx test @entifix/docs-check

      - name: Formatting
        run: pnpm exec prettier --check .

      - id: version
        run: echo "version=$(node -p "require('./packages/ts/core/package.json').version")" >> "$GITHUB_OUTPUT"

  publish:
    name: Tag, publish, announce
    needs: verify
    runs-on: ubuntu-latest
    # The approval gate. GitHub holds this job until a reviewer on the
    # `npm-publish` environment approves it, and the npm trust claim names the
    # same environment — so a job that did not declare it cannot mint a
    # publish-capable token even if this file were edited.
    environment: npm-publish
    permissions:
      contents: write
      # The entire publish credential. npm exchanges this OIDC token for a
      # short-lived, package-scoped registry token, and signs the provenance
      # attestation `.npmrc` requires. No npm token exists in this repository.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: '11.9'
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t build

      # Ordering below is deliberate, and the reason is asymmetry: npm is the
      # only irreversible step. The tag is pushed first because a tag with no
      # package is a `git push --delete` away from gone, and the GitHub Release
      # is written last because a Release announcing a version npm never
      # received is a lie that consumers read.
      - name: Tag the release
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Publish to npm
        run: pnpm nx release publish

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          node tools/release/changelog-section.mjs "${VERSION}" > /tmp/release-notes.md
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file /tmp/release-notes.md
