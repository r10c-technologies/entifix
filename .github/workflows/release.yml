name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version to cut (e.g. 0.1.0). Blank infers it from the conventional commits.'
        type: string
        default: ''
      first-release:
        description: 'Cut the first version (skips changelog inference)'
        type: boolean
        default: false
      publish-only:
        description: 'Publish the version already committed and tagged; cut nothing'
        type: boolean
        default: false
      dry-run:
        description: 'Resolve versions and print the plan, publish nothing'
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # This is the whole credential. npm trusted publishing exchanges the token
      # minted here for a short-lived, package-scoped registry token, so nothing
      # in this repository or its secrets can publish `@entifix/*` — only this
      # workflow file, on this repository, can. It is also what signs the
      # provenance attestation `.npmrc` requires.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9'
      # Deliberately no `registry-url`: it writes an `~/.npmrc` line pointing at
      # `NODE_AUTH_TOKEN`, and there is no token to point it at.
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Prove it before publishing it
        run: |
          pnpm nx run-many -t lint
          pnpm nx run-many -t build
          pnpm nx run-many -t typecheck
          pnpm nx run-many -t test --coverage

      # Skipped when the version was cut locally and only needs publishing.
      # Pass `version` to pin it: left to inference, a release whose commits are
      # all `fix:` resolves to a patch bump rather than the version intended.
      - name: Version
        if: ${{ !inputs.publish-only }}
        run: |
          pnpm nx release ${{ inputs.version }} \
            ${{ inputs.first-release && '--first-release' || '' }} \
            --skip-publish ${{ inputs.dry-run && '--dry-run' || '' }}

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: |
          pnpm nx release publish \
            ${{ inputs.first-release && '--first-release' || '' }}
