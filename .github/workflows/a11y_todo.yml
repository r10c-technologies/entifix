name: Accessibility todo

# An entry in `a11y-todo.json` is a promise that the named issue removes its
# violations (ADR 0024). This fails when that issue has closed and the entry is
# still there. Deliberately not part of `Done`: closing an issue is not
# something a pull request does, so it must not fail one.
on:
  schedule:
    - cron: '43 5 * * *'
  issues:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  open-issues:
    name: Every todo entry names an open issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            package.json
            tools/ci
            packages/react/controls/a11y-todo.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: node tools/ci/a11y-todo.mjs packages/react/controls/a11y-todo.json
        env:
          GH_TOKEN: ${{ github.token }}
