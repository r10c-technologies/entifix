name: Pull Request Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9'
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Deliberately `run-many`, not `affected`. Twenty-three small packages
      # build in about a minute; the sharding r10c needs is for a twelve-service
      # fleet, and a matrix here would cost more to maintain than it saves.
      - run: pnpm nx run-many -t lint
      # ⚠️ `--skipTypeCheck=false` is load-bearing, not thoroughness. The build's
      # declaration pass is what writes the `.d.ts`, and with the default
      # `skipTypeCheck: true` its diagnostics are **suppressed**: a package whose
      # declarations fail to compile emits nothing, leaves a build-info file
      # behind, exits 0 — and `typecheck` then reads that file, concludes the
      # project is up to date and no-ops. The first symptom is `TS6305` in nine
      # unrelated consumers naming an import that is perfectly fine.
      - run: pnpm nx run-many -t build --skipTypeCheck=false

      # Still separate, and not merged into the line above: this is the pass that
      # checks the spec files, which the library build excludes entirely.
      - run: pnpm nx run-many -t typecheck

      # Coverage is gated at 100% for `packages/*`; the plain `test` target does
      # not collect it, so CI asks for it explicitly.
      - run: pnpm nx run-many -t test --coverage

      - name: The repository's own assertions
        run: |
          pnpm nx test @entifix/tiers
          pnpm nx test @entifix/docs-check

      - name: Formatting
        run: pnpm exec prettier --check .

  # A separate job so it reports as its own required check. The version a
  # release cuts is inferred from these messages, so a commit that slips past
  # `.husky/commit-msg` — with `--no-verify`, from a clone where `pnpm install`
  # never ran, or through the GitHub web editor — does not merely look untidy,
  # it changes which version ships.
  commits:
    name: Commit conventions
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9'
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Every commit in the range
        run: |
          pnpm exec commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

      # Under a squash merge the pull request title becomes the commit message
      # on `main`, which is the text version inference then reads. Linting the
      # commits without linting the title would check something that never lands.
      - name: The pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

      # The one surface no git hook can see.
      - name: The pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" | node tools/conventions/check-pr-body.mjs
