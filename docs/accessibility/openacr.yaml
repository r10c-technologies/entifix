# Generated by tools/docs/src/openacr — edit assessment.ts and run
# `UPDATE_OPENACR=1 pnpm nx test @entifix/docs-check`, never this file.
title: entifix — Accessibility Conformance Report
product:
  name: entifix
  description: The UI packages of entifix — @entifix/react-controls,
    @entifix/react-integration and @entifix/next-shell — and the screens they
    generate.
author:
  name: entifix maintainers
  email: herbercolop@gmail.com
  website: https://github.com/r10c-technologies/entifix
notes: "Covers WCAG 2.2 Level A and AA, on which EN 301 549 V4.1.1 rests, for
  what the library renders. It cannot speak for a host’s own pages, nor for an
  identity provider’s sign-in (3.3.8): a host assesses those itself."
evaluation_methods_used: An axe gate over every Storybook story in five theme ×
  scale × density cells and over every screen of the workspace example; a
  keyboard walk over every example screen; unit and end-to-end specs; and
  review. Generated from tools/docs/src/openacr/assessment.ts, with each
  criterion’s axe rules read from axe-core.
legal_disclaimer: Provided in good faith from the evaluation described, for the
  version it ships with; not a legally binding claim.
repository: https://github.com/r10c-technologies/entifix/blob/main/docs/accessibility/openacr.yaml
feedback: https://github.com/r10c-technologies/entifix/issues
license: MIT
catalog: 2.5-edition-wcag-2.2-en
chapters:
  success_criteria_level_a:
    criteria:
      - num: 1.1.1
        components:
          - name: web
            adherence:
              level: supports
              notes: "Glyphs and skeletons are aria-hidden; every icon-only control is named;
                MediaGallery requires alternative text for each image.
                Established by the accessibility gate (axe), specs. Axe rules:
                aria-meter-name, aria-progressbar-name, image-alt,
                input-image-alt, object-alt, role-img-alt, svg-img-alt."
      - num: 1.2.1
        components:
          - name: web
            adherence:
              level: not-applicable
              notes: The library renders no audio or video. Established by review.
      - num: 1.2.2
        components:
          - name: web
            adherence:
              level: not-applicable
              notes: The library renders no audio or video. Established by review.
      - num: 1.2.3
        components:
          - name: web
            adherence:
              level: not-applicable
              notes: The library renders no audio or video. Established by review.
      - num: 1.3.1
        components:
          - name: web
            adherence:
              level: supports
              notes: "Tables carry a caption and column headers with aria-sort; card lists are
                lists of articles named by headings; read mode is a description
                list; fields are labelled and grouped; regions and landmarks are
                named. Established by the accessibility gate (axe), specs. Axe
                rules: aria-hidden-body, aria-required-children,
                aria-required-parent, definition-list, dlitem, list, listitem,
                p-as-heading, table-fake-caption, td-has-header,
                td-headers-attr, th-has-data-cells."
      - num: 1.3.2
        components:
          - name: web
            adherence:
              level: supports
              notes: DOM order is reading order; the walk fails a stop that jumps back a row.
                Established by the keyboard walk.
      - num: 1.3.3
        components:
          - name: web
            adherence:
              level: supports
              notes: Copy names controls by their label, never by shape, colour or position.
                Established by review.
      - num: 1.4.1
        components:
          - name: web
            adherence:
              level: supports
              notes: "State is never colour alone: toggles show a count and aria-expanded,
                chosen menu options a mark, invalid fields a message, links an
                underline. Established by the accessibility gate (axe), review.
                Axe rules: link-in-text-block."
      - num: 1.4.2
        components:
          - name: web
            adherence:
              level: not-applicable
              notes: The library plays no audio. Established by review.
      - num: 2.1.1
        components:
          - name: web
            adherence:
              level: supports
              notes: Every action is a native control or a WAI-ARIA pattern (menu, combobox,
                dialog, spinbutton, disclosure) with its keyboard model; header
                sort, row menus, card selection and the palette are keyboard
                operable. Established by the keyboard walk, specs.
      - num: 2.1.2
        components:
          - name: web
            adherence:
              level: supports
              notes: Dialogs and the drawer trap focus while open and release it on Escape or
                close. Established by the keyboard walk, specs.
      - num: 2.1.4
        components:
          - name: web
            adherence:
              level: supports
              notes: "Every shortcut holds Mod: a chord without it, Alt+letter, or an editing
                chord is refused when it is declared or bound (ADR 0026).
                Established by specs."
      - num: 2.2.1
        components:
          - name: web
            adherence:
              level: supports
              notes: "No content is timed out from under the reader: a failure toast and a
                toast offering an action stay until dismissed; only an
                informational toast leaves on its own. Established by specs."
      - num: 2.2.2
        components:
          - name: web
            adherence:
              level: supports
              notes: Nothing moves on its own beyond a loading shimmer, which stops when
                content arrives and honours prefers-reduced-motion. Established
                by review.
      - num: 2.3.1
        components:
          - name: web
            adherence:
              level: supports
              notes: Nothing flashes. Established by review.
      - num: 2.4.1
        components:
          - name: web
            adherence:
              level: supports
              notes: The back-office shell renders a skip link as the first stop, landing on
                main; the walk requires it and the first stop in main within
                three. Established by the keyboard walk, specs.
      - num: 2.4.2
        components:
          - name: web
            adherence:
              level: not-applicable
              notes: A page title is the host application’s (Next metadata); the workspace
                example titles every page. Established by review.
      - num: 2.4.3
        components:
          - name: web
            adherence:
              level: supports
              notes: Tab order follows reading order; after a save, a delete or a hand-off
                focus moves to the region’s heading, never to the body.
                Established by the keyboard walk, specs.
      - num: 2.4.4
        components:
          - name: web
            adherence:
              level: supports
              notes: A row’s title is its link; a row’s menu is named for its record; no
                identical “Open” links remain. Established by specs, review.
      - num: 2.5.1
        components:
          - name: web
            adherence:
              level: supports
              notes: No path-based or multipoint gesture is required. Established by review.
      - num: 2.5.2
        components:
          - name: web
            adherence:
              level: supports
              notes: Controls are native buttons and links, which act on release. Established
                by review.
      - num: 2.5.3
        components:
          - name: web
            adherence:
              level: supports
              notes: "A control’s accessible name contains its visible text, the palette’s
                Back included. Established by the accessibility gate (axe),
                specs. Axe rules: label-content-name-mismatch."
      - num: 2.5.4
        components:
          - name: web
            adherence:
              level: not-applicable
              notes: Nothing responds to device motion. Established by review.
      - num: 3.1.1
        components:
          - name: web
            adherence:
              level: not-applicable
              notes: The page language is the host’s; the shell routes each locale under its
                own prefix and the example sets lang from it. Established by
                review.
      - num: 3.2.1
        components:
          - name: web
            adherence:
              level: supports
              notes: Focus never changes context. Established by review.
      - num: 3.2.2
        components:
          - name: web
            adherence:
              level: supports
              notes: "Input changes nothing until it is applied: filters and sorting take
                effect on Apply, forms on Save. Established by specs."
      - num: 3.2.6
        components:
          - name: web
            adherence:
              level: not-applicable
              notes: The library renders no help mechanism; a host that adds one keeps it in
                one place across pages. Established by review.
      - num: 3.3.1
        components:
          - name: web
            adherence:
              level: supports
              notes: An invalid field carries aria-invalid and an aria-describedby naming its
                message; a refused save shows a summary of links that takes
                focus. Established by specs.
      - num: 3.3.2
        components:
          - name: web
            adherence:
              level: supports
              notes: "Every field is labelled; required fields are marked, with aria-required
                and a hint, before anyone submits. Established by the
                accessibility gate (axe), specs. Axe rules:
                form-field-multiple-labels."
      - num: 3.3.7
        components:
          - name: web
            adherence:
              level: supports
              notes: Forms autosave a draft and a wizard keeps every answer, so nothing
                entered is asked for again. Established by specs.
      - num: 4.1.1
        components:
          - name: web
            adherence:
              level: supports
              notes: Obsolete in WCAG 2.2, where it is always satisfied. Established by
                review.
      - num: 4.1.2
        components:
          - name: web
            adherence:
              level: supports
              notes: "Controls expose name, role and state: aria-expanded, aria-checked,
                aria-sort, aria-current, aria-busy and aria-disabled where they
                apply. Established by the accessibility gate (axe), specs. Axe
                rules: area-alt, aria-allowed-attr, aria-braille-equivalent,
                aria-command-name, aria-conditional-attr, aria-deprecated-role,
                aria-hidden-body, aria-hidden-focus, aria-input-field-name,
                aria-prohibited-attr, aria-required-attr, aria-roledescription,
                aria-roles, aria-tab-name, aria-toggle-field-name,
                aria-tooltip-name, aria-valid-attr, aria-valid-attr-value,
                button-name, duplicate-id-aria, frame-title, frame-title-unique,
                input-button-name, input-image-alt, label, link-name,
                nested-interactive, select-name, summary-name."
  success_criteria_level_aa:
    criteria:
      - num: 1.2.4
        components:
          - name: web
            adherence:
              level: not-applicable
              notes: The library renders no audio or video. Established by review.
      - num: 1.2.5
        components:
          - name: web
            adherence:
              level: not-applicable
              notes: The library renders no audio or video. Established by review.
      - num: 1.3.4
        components:
          - name: web
            adherence:
              level: supports
              notes: Nothing locks orientation. Established by review.
      - num: 1.3.5
        components:
          - name: web
            adherence:
              level: supports
              notes: An entity member declares its autofill token with @accessor({
                autocomplete }), and the generated field renders it. Established
                by specs.
      - num: 1.4.3
        components:
          - name: web
            adherence:
              level: supports
              notes: "Every palette holds its text pairs to 4.5:1 by the token contract (ADR
                0025), checked in all five cells; a refetch keeps full contrast.
                Established by the accessibility gate (axe). Axe rules:
                color-contrast."
      - num: 1.4.4
        components:
          - name: web
            adherence:
              level: supports
              notes: Type and spacing are rem-based tokens; nothing fixes a text container’s
                height. Established by review.
      - num: 1.4.5
        components:
          - name: web
            adherence:
              level: supports
              notes: No text is rendered as an image. Established by review.
      - num: 1.4.10
        components:
          - name: web
            adherence:
              level: supports
              notes: A table becomes a list of cards when its own container is too narrow for
                its columns; the shell becomes a drawer below the rail width.
                Established by the accessibility gate (axe), review.
      - num: 1.4.11
        components:
          - name: web
            adherence:
              level: supports
              notes: Control borders, the focus ring and selection hold 3:1 by the token
                contract, checked in all five cells. Established by the
                accessibility gate (axe).
      - num: 1.4.12
        components:
          - name: web
            adherence:
              level: supports
              notes: Text containers size to their content; nothing clips increased spacing.
                Established by review.
      - num: 1.4.13
        components:
          - name: web
            adherence:
              level: supports
              notes: No content appears on hover alone; menus and popovers open on activation
                and close on Escape. Established by review.
      - num: 2.4.5
        components:
          - name: web
            adherence:
              level: supports
              notes: The back-office shell offers the sidebar, the command palette and record
                search to reach any screen. Established by review.
      - num: 2.4.6
        components:
          - name: web
            adherence:
              level: supports
              notes: Every page, region, dialog and menu group is headed or named by what it
                holds. Established by specs, review.
      - num: 2.4.7
        components:
          - name: web
            adherence:
              level: supports
              notes: Every Tab stop shows a focus ring of 3:1 against its surface; the walk
                fails a stop without one. Established by the keyboard walk, the
                accessibility gate (axe).
      - num: 2.4.11
        components:
          - name: web
            adherence:
              level: supports
              notes: The walk fails a focused stop covered by anything; scroll padding keeps a
                focused row clear of a sticky header and of toasts. Established
                by the keyboard walk.
      - num: 2.5.7
        components:
          - name: web
            adherence:
              level: supports
              notes: "Nothing requires dragging: column order and sort priority move by
                buttons. Established by review."
      - num: 2.5.8
        components:
          - name: web
            adherence:
              level: supports
              notes: "Every target reaches --target-min (24px) in every scale and density; the
                gate measures hit areas in the compact cell and the example’s
                navigation at both densities. Established by the accessibility
                gate (axe), specs. Axe rules: target-size."
      - num: 3.1.2
        components:
          - name: web
            adherence:
              level: supports
              notes: Localized text shown from another locale, as a fallback, is marked with
                that language. Established by specs.
      - num: 3.2.3
        components:
          - name: web
            adherence:
              level: supports
              notes: The shell renders the same navigation, in the same order, on every page.
                Established by review.
      - num: 3.2.4
        components:
          - name: web
            adherence:
              level: supports
              notes: One ActionBar renders every action surface, so a verb has one name and
                one place wherever it appears. Established by review.
      - num: 3.3.3
        components:
          - name: web
            adherence:
              level: supports
              notes: Validation messages say what the field needs, from the catalog, and never
                show a key. Established by specs.
      - num: 3.3.4
        components:
          - name: web
            adherence:
              level: supports
              notes: A destructive verb declares how it is undone — Undo, a confirmation, or
                the name typed — and Server Action forms confirm with or without
                JavaScript (ADR 0026). Established by specs.
      - num: 3.3.8
        components:
          - name: web
            adherence:
              level: not-applicable
              notes: The library renders no authentication; sign-in is the host’s identity
                provider, which the host must assess. Established by review.
      - num: 4.1.3
        components:
          - name: web
            adherence:
              level: supports
              notes: Results, saves, deletions, page changes, live-update drops and recoveries
                are announced through status regions without moving focus;
                failures through alerts. Established by specs.
